name: amap_kit_map
description: AMap map widget and controller for Flutter.
version: 0.1.0
repository: https://github.com/ryujane/amap_kit

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  amap_kit_core: ^0.1.0
  amap_kit_map_android: ^0.1.0
  amap_kit_map_ios: ^0.1.0
  amap_kit_map_platform_interface: ^0.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: amap_kit_map_android
      ios:
        default_package: amap_kit_map_ios

topics:
  - amap-kit
  - amap-flutter
  - amap
  - gaode
